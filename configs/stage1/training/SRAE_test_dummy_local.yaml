stage_1:
  target: stage1.SRAE
  params:
    dinov2_model_name: "facebook/dinov2-with-registers-base"
    img_size: 224
    patch_size: 14
    mask_ratio: 0.75
    bottleneck_dim: 768
    use_l2_norm: true
    projector_hidden_dim: 4096
    decoder_num_layers: 4
    decoder_num_heads: 8
    decoder_dim: 256
    loss_rec_weight: 1.0
    loss_align_weight: 0.1
    loss_reg_weight: 0.01
    teacher_output_type: "cls"

training:
  epochs: 2
  ema_decay: 0.9999
  global_batch_size: 8
  num_workers: 2
  clip_grad: 1.0
  log_interval: 5
  checkpoint_interval: 1
  sample_every: 10
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 0
    decay_end_epoch: 2
    base_lr: 1.0e-4
    final_lr: 1.0e-5
    warmup_from_zero: false

eval:
  eval_interval: 10
  max_eval_samples: 20

gan:
  disc:
    arch:
      dino_ckpt_path: 'facebook/dinov2-with-registers-base'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 1.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 0
      decay_end_epoch: 2
      base_lr: 1.0e-4
      final_lr: 1.0e-5
      warmup_from_zero: false
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.0
    perceptual_weight: 0.0
    disc_start: 100
    disc_upd_start: 100
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
