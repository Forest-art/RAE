stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: 'facebook/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTB'
    noise_tau: 0.8
    reshape_to_2d: true

training:
  epochs: 2
  ema_decay: 0.9999
  global_batch_size: 8
  num_workers: 2
  clip_grad: 1.0
  log_interval: 5
  checkpoint_interval: 1
  sample_every: 10
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 0
    decay_end_epoch: 2
    base_lr: 1.0e-4
    final_lr: 1.0e-5
    warmup_from_zero: false

# 启用在线评估 - rFID 评测
eval:
  eval_interval: 5          # 每 5 个 step 评估一次
  eval_model: true          # 同时评估非 EMA 模型
  data_path: './dummy_data/val/'        # 验证集图像路径
  reference_npz_path: './dummy_val.npz' # 参考图像 NPZ 文件路径
  metrics: ['psnr', 'ssim', 'rfid']     # 要计算的指标

gan:
  disc:
    arch:
      dino_ckpt_path: 'facebook/dinov2-with-registers-base'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 1.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 0
      decay_end_epoch: 2
      base_lr: 1.0e-4
      final_lr: 1.0e-5
      warmup_from_zero: false
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.0
    perceptual_weight: 0.0
    disc_start: 100
    disc_upd_start: 100
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
