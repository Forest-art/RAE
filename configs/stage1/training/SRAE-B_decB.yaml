stage_1:
  target: stage1.SRAE
  params:
    # DINOv2 backbone
    dinov2_model_name: "facebook/dinov2-base"
    img_size: 224
    patch_size: 14
    
    # Masking
    mask_ratio: 0.75
    
    # Bottleneck
    bottleneck_dim: 768
    use_l2_norm: true
    
    # Projector
    projector_hidden_dim: 4096
    
    # Decoder
    decoder_num_layers: 8
    decoder_num_heads: 16
    decoder_dim: 512
    
    # S-RAE specific loss weights
    loss_rec_weight: 1.0
    loss_align_weight: 0.1
    loss_reg_weight: 0.01
    
    # Teacher output type
    teacher_output_type: "cls"  # "cls" or "patch"

training:
  epochs: 100
  ema_decay: 0.9978
  global_batch_size: 512
  num_workers: 8
  clip_grad: 0.0
  log_interval: 100
  checkpoint_interval: 10
  sample_every: 2500
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 100
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

# 评估配置
eval:
  eval_interval: 2500
  eval_model: true
  metrics: ['psnr', 'ssim', 'rfid']
  max_eval_samples: 1000
  # For local ImageFolder eval, set data_path; for HF eval, pass --use-hf-eval.
  # data_path: 'data/imagenet/val/'

periodic_eval:
  every_steps: 2500
  split: val
  num_samples: -1  # <=0 means full split

gan:
  disc:
    arch:
      dino_ckpt_path: '../models/discs/dino_vit_small_patch8_224.pth'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 100
      base_lr: 2.0e-4
      final_lr: 2.0e-5
      warmup_from_zero: true
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75      # GAN loss weight (adaptive)
    perceptual_weight: 1.0  # LPIPS weight
    disc_start: 8           # Epoch to start GAN training
    disc_upd_start: 6       # Epoch to start discriminator updates
    lpips_start: 0          # Epoch to start LPIPS
    max_d_weight: 10000.0
    disc_updates: 1
